name: Check package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run build:component && npm run build-storybook
      - run: npm exec --workspace=gensplore -- playwright install --with-deps chromium
      - run: npm run test:package
      - run: npm run build
      - run: npm run test:previews
