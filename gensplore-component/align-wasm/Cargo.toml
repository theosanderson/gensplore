[package]
name = "gensplore-align"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Nextclade's nucleotide aligner, built to WebAssembly for Gensplore's comparison worker"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to the commit of the Nextclade web-3.23.0 release; bump together with the built output.
nextclade = { git = "https://github.com/nextstrain/nextclade", rev = "629ea8fb0cfe3165db13ddc75dab16d3c2292dbd" }
wasm-bindgen = "=0.2.106"
# Nextclade's dependencies pull in both getrandom lines; both need their browser backend.
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom_0_2 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-simd", "--enable-nontrapping-float-to-int"]
